<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seattle 2080 — Tableau des runs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <canvas id="fond" aria-hidden="true"></canvas>

  <header class="topbar">
    <div class="topbar-title">
      <span class="glyph">◢</span>
      <h1>SEATTLE<span class="accent">//</span>2080</h1>
      <span class="subtitle">tableau des runs</span>
    </div>
    <div class="topbar-right">
      <button id="btn-filtre" class="badge badge-bouton" hidden title="Afficher les runs jouées">○ RUNS JOUÉES</button>
      <button id="btn-reload" class="badge badge-bouton" hidden title="Recharger les fichiers YAML">⟳ CONTENU</button>
      <span id="badge-role" class="badge badge-role"></span>
      <button id="btn-logout" class="badge badge-bouton" hidden title="Se déconnecter">⏻</button>
    </div>
  </header>

  <main id="map"></main>

  <aside id="sidebar" class="sidebar" aria-hidden="true">
    <button id="sidebar-close" class="sidebar-close" title="Fermer">✕</button>
    <div id="sidebar-content"></div>
  </aside>

  <div id="login" class="login-overlay" hidden>
    <form id="login-form" class="login-panel">
      <div class="login-glyph">◢◤</div>
      <h2>SEATTLE<span class="accent">//</span>2080</h2>
      <p class="login-sub">Identifie-toi, runneuse.</p>
      <input id="login-mdp" type="password" placeholder="Phrase de passe…" autocomplete="current-password">
      <button class="btn" type="submit">Connexion</button>
      <div id="login-erreur" class="login-erreur"></div>
    </form>
  </div>

  <footer class="statusbar">
    <span id="status-coords">—</span>
    <span class="status-sep">|</span>
    <span id="status-runs">connexion…</span>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="effets.js"></script>
  <script src="fond.js"></script>
  <script src="app.js"></script>
</body>
</html>
