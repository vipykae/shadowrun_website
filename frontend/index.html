<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seattle 2080 — Tableau des runs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <canvas id="fond" aria-hidden="true"></canvas>

  <header class="topbar">
    <div class="topbar-title">
      <span class="glyph">◢</span>
      <h1>SEATTLE<span class="accent">//</span>2080</h1>
      <span class="subtitle">tableau des runs</span>
    </div>
    <div class="topbar-right">
      <button id="btn-vue" class="badge badge-bouton" hidden title="Voir les personnages"><span class="ico">▣</span><span class="txt">PERSONNAGES</span></button>
      <button id="btn-historique" class="badge badge-bouton" hidden title="Historique des runs"><span class="ico">🗒</span><span class="txt">HISTORIQUE</span></button>
      <button id="btn-calendrier" class="badge badge-bouton" hidden title="S'abonner au calendrier des runs"><span class="ico">📅</span><span class="txt">CALENDRIER</span></button>
      <button id="btn-nouvelle-run" class="badge badge-bouton badge-mj" hidden title="Créer une run"><span class="ico">+</span><span class="txt">RUN</span></button>
      <button id="btn-nouveau-perso" class="badge badge-bouton" hidden title="Ajouter un personnage"><span class="ico">+</span><span class="txt">PERSO</span></button>
      <button id="btn-filtre" class="badge badge-bouton" hidden title="Afficher les runs jouées"><span class="ico">○</span><span class="txt">RUNS JOUÉES</span></button>
      <button id="btn-reload" class="badge badge-bouton" hidden title="Recharger les fichiers YAML"><span class="ico">⟳</span><span class="txt">CONTENU</span></button>
      <span id="badge-role" class="badge badge-role" hidden><span class="txt">ACCÈS :</span><span id="badge-role-nom"></span></span>
      <button id="btn-logout" class="badge badge-bouton" hidden title="Se déconnecter"><span class="ico">⏻</span></button>
    </div>
  </header>

  <main id="map"></main>

  <main id="personnages" hidden>
    <section class="perso-section">
      <h2 class="perso-titre-section">Personnages joueuses</h2>
      <div class="perso-grid" id="grille-pj"></div>
    </section>
    <section class="perso-section">
      <h2 class="perso-titre-section">PNJ notables</h2>
      <div class="perso-grid" id="grille-pnj"></div>
    </section>
  </main>

  <main id="historique" hidden>
    <div class="historique-filtres">
      <label class="champ-filtre">
        <span>District</span>
        <select id="filtre-district"><option value="">Tous</option></select>
      </label>
      <label class="champ-filtre">
        <span>Statut</span>
        <select id="filtre-statut">
          <option value="a-venir">À venir</option>
          <option value="jouee">Jouées</option>
          <option value="annulee">Annulées</option>
          <option value="toutes">Toutes</option>
        </select>
      </label>
      <label class="champ-filtre champ-filtre-recherche">
        <span>Recherche</span>
        <input id="filtre-recherche" type="text" placeholder="Titre…">
      </label>
    </div>
    <table class="tableau-runs">
      <thead>
        <tr>
          <th>Titre</th>
          <th>District</th>
          <th>Date</th>
          <th>Statut</th>
          <th>Places</th>
          <th>Difficulté</th>
        </tr>
      </thead>
      <tbody id="corps-tableau-runs"></tbody>
    </table>
    <p id="historique-vide" class="historique-vide" hidden>Aucune run ne correspond à ces filtres.</p>
  </main>

  <aside id="sidebar" class="sidebar" aria-hidden="true">
    <button id="sidebar-close" class="sidebar-close" title="Fermer"><span>✕</span></button>
    <div id="sidebar-content"></div>
  </aside>

  <div id="login" class="login-overlay" hidden>
    <form id="login-form" class="login-panel">
      <div class="login-glyph">◢◤</div>
      <h2>SEATTLE<span class="accent">//</span>2080</h2>
      <p class="login-sub">Identifie-toi, runneuse.</p>
      <input id="login-mdp" type="password" placeholder="Phrase de passe…" autocomplete="current-password">
      <button class="btn" type="submit">Connexion</button>
      <div id="login-erreur" class="login-erreur"></div>
    </form>
  </div>

  <footer class="statusbar">
    <span id="status-coords">—</span>
    <span class="status-sep">|</span>
    <span id="status-runs">connexion…</span>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="effets.js"></script>
  <script src="fond.js"></script>
  <script src="crop.js"></script>
  <script src="mj.js"></script>
  <script src="personnages.js"></script>
  <script src="historique.js"></script>
  <script src="app.js"></script>
</body>
</html>
