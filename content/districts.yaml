  description: |-
    Les îles chics du Puget Sound (Bainbridge, Vashon, Fox, McNeil, Anderson) — sûreté très élevée (indice AA), la plus haute du métroplexe. Domaine du clan Tanjo (Dragon marin, MCT), avec Thesis, le presque-dernier bastion d'Ares dans la baie. Tensions latentes entre MCT et Yakuza, plus une poche de vampires sur Anderson.
  fiche:
    population: |-
      123 000 habitants — 40 % humains, 30 % elfes, 5 % nains, 20 % orks, 2 % trolls, 3 % autres.
    indice_surete: AA
    ambiance: |-
      Les cinq îles principales du Puget Sound, de plus en plus intégrées au métroplexe.
    a_voir: |-
      Bainbridge et ses résidences de luxe accaparées par MCT, Vashon et ses villas branchées, Fox — havre du Dragon marin et des esprits, jadis un site de salines gardé par tritons et drakes —, McNeil, une ancienne prison géante, et Anderson, une vaste maison de retraite pour fortunés. À l'écart de ces cinq-là, une île artificielle au milieu de la baie d'Elliot, quasi le dernier bastion d'Ares dans le coin, prodige d'ingénierie désormais repris par Hard Corps. ⚠️ Extrait imparfaitement lisible dans le livre : à vérifier de ton côté si tu veux les noms exacts.
    lieux_sensibles: |-
      Le territoire du Dragon marin (moins par peur de ses méthodes que par crainte de la guerre qui l'oppose à la triple-A) et le camp de squatters de Vashon, où la jeunesse humaine se retrouve entre elle.
    faire_attention_a: |-
      Le Dragon marin, MCT — dont la présence s'accompagne d'une forte influence Yakuza — et ce qu'il reste des TilDawns, un gang de vampires retranché sur Anderson.
