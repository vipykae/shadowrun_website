  description: |-
    L'âme du métroplexe (indice AA) : gratte-ciel, costards, et les sièges de Shiawase et Aztechnology. Tout le district est sous surveillance — caméras et senseurs à chaque devanture. La Lone Star le quadrille, saluée par les syndicats du crime qui y opèrent sans se cacher.
  fiche:
    population: |-
      545 000 habitants — 63 % humains, 13 % elfes, 2 % nains, 19 % orks, 2 % trolls, 1 % autres.
    indice_surete: AA
    ambiance: 'L''âme du métroplexe : gratte-ciel et costards.'
    a_voir: |-
      Le Club Penumbra et le Dante's Inferno, où l'on trouve un nouveau boulot et où l'on dépense les nuyens du précédent ; la Space Needle ; l'arcologie Shiawase ou la pyramide d'Aztechnology, pour faire les boutiques.
    lieux_sensibles: |-
      Tout le district est sous surveillance : chaque devanture, chaque bureau a ses capteurs et ses caméras.
    faire_attention_a: |-
      Les autres runners, la Lone Star qui quadrille le secteur, et les syndicats du crime qui y opèrent au grand jour, salués par tous.
