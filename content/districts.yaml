  description: |-
    L'autre port de Seattle, la « Ville du Destin » : ambiance industrielle et culture ouvrière assumée (indice de sûreté B). Fusion des cultures au menu et sur les murs (le Crying Wall), sous la coupe du gang dominant Kabuki Ronin et des Eye-Fivers.
  fiche:
    population: |-
      375 000 habitants — 68 % humains, 11 % elfes, 2 % nains, 16 % orks, 2 % trolls, 1 % autres.
    indice_surete: B
    ambiance: |-
      La « Ville du Destin », l'autre port de Seattle : une odeur industrielle imprégnée jusque dans le béton, et un sens aigu de la débrouille.
    a_voir: |-
      La fusion des cultures, à goûter (la cuisine tanzano-indienne, ça vous tente ?) comme à contempler : le Crying Wall, monument dédié aux victimes de la Nuit de la Rage, sert aussi d'entrée vers l'Underground.
    lieux_sensibles: |-
      Les tours jumelles qui abritent le siège de Shiawase, et Little Asia, dont l'influence bascule tantôt du côté triple-A, tantôt du côté Yakuza.
    faire_attention_a: |-
      C'est le district le plus cosmopolite, un vrai melting-pot d'organisations criminelles communautaires (Yakuza, Mafia, Vory, Triades, Seoulpa et bien d'autres) qui veulent toutes leur part du gâteau. Paradoxalement, la criminalité de rue y reste basse — sans doute grâce à ce réseau criminel organisé, qui préfère ne pas brutaliser ses propres clients ni faire fuir les gangs.
