  description: |-
    Le dortoir idéalisé de Seattle (indice A) : pavillons bourgeois, parcs, base de ski artificielle sur Cougar Mountain. Sous le vernis, Yakuza et Mafia tiennent les vices « respectables », les gangs (Blood Mountain Boys, Night Hunters...) sortent la nuit, et les Voisins Vigilants jouent aux justiciers en s'imaginant Star.
  fiche:
    population: |-
      240 000 habitants — 61 % humains, 10 % elfes, 2 % nains, 22 % orks, 2 % trolls, 2 % autres.
    indice_surete: A
    ambiance: Le dortoir idéalisé de Seattle.
    a_voir: |-
      De petits quartiers bourgeois et familiaux, des parcs, des cours d'eau, parfaits pour la balade. Sur ce point, Cougar Mountain rafle la mise : c'est une gigantesque station de ski artificielle.
    lieux_sensibles: |-
      Olympic City — l'ancien village olympique des JO de 2076, envahi par des squatteurs après que le gouvernement du métroplexe a tenté de le récupérer, déclenchant une véritable guérilla.
    faire_attention_a: |-
      Yakuza et Mafia, qui y organisent des vices « respectables », et les gangs (Blood Mountain Boys, Night Hunters, entre autres) qui revendiquent leur pré carré une fois la nuit tombée. Les Voisins Vigilants, une milice qui s'acoquine volontiers avec l'Humanis, se prennent pour la Lone Star.
