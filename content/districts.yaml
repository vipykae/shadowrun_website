- id: puyallup
  nom: Puyallup
  gang_dominant: Ancients
  gangs_presents: []
  megacorp_dominante: null
  megacorps_presentes: []
  autre_faction_dominante: Yakuza
  autres_factions_presentes: [Mafia]
  description: |-
    Le dépotoir du métroplexe, à l'ombre du Mont Rainier — même Redmond regarde Puyallup de haut. Nature toxique (geysers, champs de cendres), Yakuza et Mafia y font la loi économique, sûreté au plus bas (indice Z). Tarislaw offre un avant-goût low-cost du Tir Tairngire pour qui cherche du travail ou des emplettes.
  fiche:
    population: |-
      515 070 habitants — 47 % humains, 21 % elfes, 4 % nains, 22 % orks, 5 % trolls, 1 % autres.
    indice_surete: Z
    ambiance: |-
      Un havre désolé pour les rebuts et les gangers, à l'ombre d'un Mont Rainier qui crache sa lave — comme on dit ici, « au moins ce n'est pas Redmond ».
    a_voir: |-
      Loveland, pour trouver du travail ou faire ses emplettes (Yakuza et Mafia y tiennent une bonne partie du commerce, c'est un quartier plutôt tenu), et Tarislaw, qui offre un avant-goût très low-cost du Tir Tairngire.
    lieux_sensibles: |-
      En dehors de Puyallup-ville elle-même, appartenant aux gangs, la nature y est franchement hostile — voire toxique : geysers, champs de cendres, coulées de lave solidifiée. Carbonado (des mines toxiques) et Hope (un bidonville tentaculaire de caravanes, cabanes et tentes, une vraie Cour des Miracles) complètent le tableau.
    faire_attention_a: |-
      L'absence de véritables forces de l'ordre — la milice levée par la mairie de Puyallup a du répondant mais aussi ses défauts, le poste de police se partageant en pratique entre Mafia, Yakuza et une multitude de petits gangs. Les derniers Ancients encore en vie sont nés ici.
