  description: |-
    Un port tentaculaire à l'esprit ouvert, propre aux dockers (indice B). Boeingville (le quartier de Federated-Boeing), la base navale du métroplexe (BNME) et des docks abandonnés squattés en attente de réaménagement. Mercenaires, marins, syndicats de dockers et crime organisé attiré par « l'import-export » s'y côtoient.
  fiche:
    population: |-
      237 000 habitants — 67 % humains, 11 % elfes, 7 % nains, 11 % orks, 2 % trolls, 2 % autres.
    indice_surete: B
    ambiance: |-
      Un port gigantesque qui a forgé un esprit d'ouverture propre aux gens des docks.
    a_voir: |-
      Les quartiers de débauche proches des quais, où la prostitution est légale ; Boeingville, le fief de Federated-Boeing ; des hôpitaux et cliniques spécialisés dans les améliorations corporelles ; le Gravity Bar North, référence pour qui cherche du travail.
    lieux_sensibles: |-
      La base navale du métroplexe (BNME) et les innombrables docks à l'abandon, envahis de squatteurs, en attente d'un hypothétique réaménagement.
    faire_attention_a: |-
      Les mercenaires et marins qui traînent près de leurs navires, l'autorité portuaire qui garde l'œil sur eux, les syndicats de dockers et d'ouvriers du bâtiment engagés dans les rénovations en cours, et le crime organisé, très attiré par les possibilités d'import-export du coin.
