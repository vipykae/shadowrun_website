  autres_factions_presentes: [Lone Star]
  description: |-
    Le grenier agricole du métroplexe — et son coin le plus raciste. Ambiance de campagne cossue (antiquaires, Fête de la Récolte), sûreté élevée (indice A), mais des locaux très méfiants envers les étrangers et un fort ancrage de l'Humanis Policlub. La Lone Star y patrouille à moto comme un gang de plus.
  fiche:
    population: |-
      121 000 habitants — 91 % humains, 4 % elfes, 1 % nains, 3 % orks, moins de 1 % de trolls et d'autres.
    indice_surete: A
    ambiance: |-
      Le grenier du métroplexe — au sens agricole comme au sens le plus corporatiste et raciste du terme.
    a_voir: |-
      Un charme de campagne assumé, des boutiques d'antiquités, et la Fête de la Récolte qui court de l'équinoxe d'automne jusqu'à la Toussaint.
    lieux_sensibles: |-
      Des locaux qui n'aiment pas les têtes inconnues même quand vous affichez patte blanche, beaucoup affiliés à l'Humanis, et une obsession pour l'autonomie alimentaire : les cultivateurs n'hésitent pas à rapporter tout mouvement suspect près de leurs exploitations aux autorités comme aux corpos.
    faire_attention_a: |-
      Les patrouilles de la Lone Star à moto, qui s'y comportent comme un gang de plus, et le policlub Humanis local dans ce qu'il a de plus dur.
