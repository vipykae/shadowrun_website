  description: |-
    Le fief des Native American Nations en plein cœur du métroplexe (indice A) : nature restaurée, ambassades, diplomatie — et une île entière sous surveillance stricte (SIN vérifiés à chaque entrée/sortie, port d'armes très limité). Les rangers salish et Eagle Security n'ont rien à envier à la Lone Star ; les Koshari y tiennent les trafics.
  fiche:
    population: |-
      4 000 habitants — 32 % humains, 21 % elfes, 8 % nains, 32 % orks, 4 % trolls, 3 % autres.
    indice_surete: A
    ambiance: |-
      Le fief des Native American Nations en plein cœur du métroplexe : nature restaurée et diplomatie.
    a_voir: |-
      Un coucher de soleil depuis l'une des plages paradisiaques de l'île, les ambassades, les loges tribales.
    lieux_sensibles: |-
      L'île entière est sous surveillance : chaque arrivée et chaque départ, par route, par bateau ou par véhicule aérien, est étroitement scruté, les SIN des visiteurs vérifiés dans le détail, et le port d'armes très limité.
    faire_attention_a: |-
      Les rangers salish et Eagle Security n'ont rien à envier à la Lone Star côté sévérité ; à l'autre bout du spectre, les Koshari tiennent les différents trafics de l'île.
