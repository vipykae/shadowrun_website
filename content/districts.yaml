- id: redmond
  nom: Redmond
  gang_dominant: Crimson Crush
  gangs_presents: [Halloweeners, Cutters, 162s, Rusted Stilettos]
  megacorp_dominante: Aztechnology
  megacorps_presentes: []
  autre_faction_dominante: null
  autres_factions_presentes: []
  description: |-
    Le pire district du métroplexe (indice Z) : survie urbaine pure. Touristville maquille la misère au néon pour les riches en goguette, pendant que Glow City — les ruines irradiées de la centrale de Trojan-Satsop — n'abrite plus que les Rusted Stilettos et des chamans toxiques. Halloweeners, Cutters, Crimson Crush et 162s s'y disputent chaque trottoir ; quant au dragon Urubia, malgré ses airs de bienfaitrice, mieux vaut ne pas traiter avec elle.
  fiche:
    population: |-
      540 000 habitants — 74 % humains, 6 % elfes, 3 % nains, 12 % orks, 2 % trolls, 3 % autres.
    indice_surete: Z
    ambiance: La survie en milieu urbain, à l'état pur.
    a_voir: |-
      Touristville, où les nantis viennent s'encanailler dans une parodie de pauvreté maquillée au néon ; le Funhouse, un bloc rénové tenu par le dragon Urubia, qui y offre travail, éducation, soins et loisirs dans un ersatz d'arcologie.
    lieux_sensibles: |-
      Ici, tout est suspect : le Stuffer Shack le plus anodin peut cacher un laboratoire clandestin d'Aztechnology en sous-sol. Physiquement comme astralement, mieux vaut éviter Glow City, l'enfer radioactif qui entoure l'ancienne centrale de Trojan-Satsop près du lac Beaver — seuls y survivent les Rusted Stilettos et des chamans toxiques.
    faire_attention_a: |-
      Halloweeners, Cutters, Crimson Crush et 162s (des goules !) : les gangs s'y comptent par dizaines et se disputent chaque coin de rue. Et malgré ses grands airs de bienfaitrice, un principe s'impose ici plus qu'ailleurs : on ne traite pas avec Urubia.
