  description: |-
    Le havre des (très) riches (indice AA) : micro-arcologies, clubs select et loisirs de luxe, tenue correcte exigée. La Briqueterie y sert de prison pour cols blancs. Forte présence mafieuse et des Nova Rich, plus une communauté First Nations ; les gangs 405 Hellhounds et Leather Devils se disputent les abords.
  fiche:
    population: |-
      221 000 habitants — 57 % humains, 16 % elfes, 3 % nains, 20 % orks, 2 % trolls, 2 % autres.
    indice_surete: AA
    ambiance: 'Le havre des (très) riches : micro-arcologies et loisirs de luxe.'
    a_voir: |-
      Cougar Mountain, avec son hôpital et son centre de divertissement ; Powerline, un club libertin huppé ; les boîtes de nuit du coin, où une tenue correcte est de rigueur.
    lieux_sensibles: La « Briqueterie », qui sert de prison aux criminels en col blanc.
    faire_attention_a: |-
      Une intense activité mafieuse et une forte présence de Nova Rich, ainsi qu'une communauté First Nations bien implantée. Les gangs 405 Hellhounds et Leather Devils, rivaux, rôdent en bordure du district.
