  description: |-
    Quartier ouvrier au ronronnement d'usines permanent (indice B) : travail, famille, chasse et messe, avec une percée croissante de l'Humanis. Le Supermall (2e centre commercial de Seattle) attire les foules ; Pleasant Hills, le ghetto local, et le centre pénitentiaire Wynaco sont à éviter. Mafia et Yakuza s'y partagent le territoire, la seconde prenant l'avantage — laissant une brèche aux gangs Skraacha et Ancients.
  fiche:
    population: |-
      224 000 habitants — 61 % humains, 6 % elfes, 2 % nains, 28 % orks, 2 % trolls, moins de 1 % d'autres.
    indice_surete: B
    ambiance: |-
      Une classe ouvrière assumée : travail, famille, chasse et messe, sur fond de ronronnement permanent des usines.
    a_voir: |-
      L'Aurora, un bar à runners, et le Supermall, deuxième plus grand centre commercial de Seattle — vous y trouverez forcément votre bonheur.
    lieux_sensibles: |-
      Le siège du policlub Humanis, Pleasant Hills (surnommé le « Puyallup du nord », le ghetto local), Stuck's Carnival (un casino de quartier privé) et le centre pénitentiaire Wynaco, tenu par la Lone Star.
    faire_attention_a: |-
      Mafia et Yakuza se partagent le territoire, mais le déclin des syndicats ouvriers fait pencher la balance en faveur de la seconde. Ce recul mafieux laisse aussi une ouverture aux gangs Skraacha et à quelques Ancients, que l'Humanis n'a pas encore réussi à chasser.
