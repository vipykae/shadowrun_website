# La carte affichée. Les coordonnées (polygones des districts, positions
# des pins) sont en pixels de cette image, origine en haut à gauche.
image: carte_seattle_web.jpg
largeur: 2048
hauteur: 3974
# Carte du niveau "sous-sol" (Underground), affichée quand on bascule dans
# ce mode. Doit avoir exactement les mêmes largeur/hauteur que l'image
