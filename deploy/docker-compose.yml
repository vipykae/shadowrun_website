# Lancement depuis le dossier deploy/ :
#   cp .env.example .env   puis remplir .env (voir scripts/genere_hash.py)
#   docker compose up -d --build
services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: .env
    volumes:
      # En lecture-écriture : le backend écrit lui-même les YAML de content/
      # (création/édition de run ou de district depuis l'accès MJ, voir
      # backend/app.py). Un montage :ro casserait ces écritures en silence.
      - ../content:/app/content
      - donnees:/app/data

  bot:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.bot
    restart: unless-stopped
    env_file: .env

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAINE=${DOMAINE}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  donnees:
  caddy_data:
  caddy_config:
